projects_heading: Selected projects

projects:
  - slug: metr
    name: metr.
    description: >-
      Ride booking for independent drivers. Riders book their own driver directly
      instead of going through Uber or Lyft.
    screenshot: /images/metr.png
    screenshot_alt: Screenshot of the metr. ride booking app
    live_url: https://metr.hmblbot.com/tour
    code_url:               # add when the repo is public
    features:
      - Stripe Connect card payments, with holds on accept, capture at drop-off and tips
      - Stripe Billing Pro plan
      - Native iOS and Android apps (Capacitor) with Mapbox turn-by-turn and push notifications
      - Live ride tracking with traffic-aware ETAs
      - In-ride chat
      - Mileage and expense log for taxes
      - 438 automated tests
    stack: [Rails 8, Inertia, React, TypeScript, Tailwind, PostgreSQL, Stripe, Mapbox, Twilio, Capacitor]

  - slug: recoverybot
    name: RecoveryBot
    description: A platform for running 12-step recovery groups.
    screenshot: /images/recoverybot.png
    screenshot_alt: Screenshot of the RecoveryBot group management platform
    live_url: https://recoverybot.hmblbot.com
    code_url: https://github.com/thisguycolton/HMBLBOT-RecoveryBot
    features:
      - A library of recovery books with search across all of them and shareable highlights
      - Groups with meetings and court-verification forms
      - Bylaws and policies as live documents, with PDF export and Word import
      - Decision logs and business-meeting minutes checked against Robert's Rules
      - Treasurer's reports and host scheduling for 28 weekly meetings
      - A Tiptap-based page editor
    stack: [Rails, React, Vite, Tailwind, Tiptap, Docker]

